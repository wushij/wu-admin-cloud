server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: wu-cloud-gateway
  config:
    import:
      - optional:nacos:wu-cloud-common.yaml?group=WU_CLOUD&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=WU_CLOUD&refreshEnabled=true
  # P0-1: 网关必须与 auth 共用同一 Redis，否则登录态不互通（此前缺失导致全部 401）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  cloud:
    loadbalancer:
      cache:
        enabled: true
        # 本地开发服务常热重启：过长缓存会把已挂实例继续打出偶发 503
        ttl: 1s
        capacity: 256
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: WU_CLOUD
        register-enabled: true
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: WU_CLOUD
        file-extension: yaml
        import-check:
          enabled: false
    # P0-1: 网关必须与 auth 共用同一 Redis，否则登录态不互通（此前缺失导致全部 401）
    # 参数与 wu-cloud-auth 的 application.yml 保持一致，确保 Sa-Token Token 互认
    gateway:
      # 下游连接失败 / 5xx：GET 自动重试，吸收热重启与 LB 短暂脏缓存
      default-filters:
        - name: Retry
          args:
            retries: 2
            methods: GET
            series: SERVER_ERROR
            exceptions:
              - java.io.IOException
              - java.util.concurrent.TimeoutException
            backoff:
              firstBackoff: 80ms
              maxBackoff: 400ms
              factor: 2
              basedOnPreviousValue: false
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
      routes:
        # ===== 业务路由（P1：已移除 monitor/AI/dict/codegen/config-log 的 compat Rewrite）=====
        # Knife4j 接口文档：/api/doc.html → system 服务 /doc.html
        - id: compat-api-doc
          uri: lb://wu-service-system
          predicates:
            - Path=/api/doc.html,/api/v3/api-docs,/api/v3/api-docs/**,/api/swagger-ui,/api/swagger-ui/**,/api/webjars/**
          filters:
            - RewritePath=/api/(?<seg>.*), /$\{seg}

        - id: wu-cloud-auth
          uri: lb://wu-cloud-auth
          predicates:
            - Path=/api/auth/**

        # wu-admin BFF（含规范仪表盘 /api/admin/dashboard/**）
        - id: wu-admin
          uri: lb://wu-admin
          predicates:
            - Path=/api/admin/**

        # 双轨：旧 /api/system/dashboard → /api/admin/dashboard
        - id: compat-dashboard-legacy
          uri: lb://wu-admin
          predicates:
            - Path=/api/system/dashboard,/api/system/dashboard/**
          filters:
            - RewritePath=/api/system/dashboard(?<seg>/?.*), /api/admin/dashboard$\{seg}

        # 导出工单/审批（规范路径）
        - id: wu-service-ticket-export
          uri: lb://wu-service-ticket
          predicates:
            - Path=/api/export/ticket,/api/export/approval

        # 工单/审批/通知（P1.5 规范路径）
        - id: wu-service-ticket-biz
          uri: lb://wu-service-ticket
          predicates:
            - Path=/api/ticket,/api/ticket/**,/api/approval,/api/approval/**,/api/notice,/api/notice/**

        # P1.5 双轨：旧 /api/system/export/* → /api/export/*
        - id: compat-ticket-export-legacy
          uri: lb://wu-service-ticket
          predicates:
            - Path=/api/system/export/ticket,/api/system/export/approval
          filters:
            - RewritePath=/api/system/export/(?<seg>.*), /api/export/$\{seg}

        # P1.5 双轨：旧 /api/system/ticket|approval|notice → /api/ticket|approval|notice
        - id: compat-ticket-legacy
          uri: lb://wu-service-ticket
          predicates:
            - Path=/api/system/ticket,/api/system/ticket/**,/api/system/approval,/api/system/approval/**,/api/system/notice,/api/system/notice/**
          filters:
            - RewritePath=/api/system/(?<seg>.*), /api/$\{seg}

        - id: wu-service-system
          uri: lb://wu-service-system
          predicates:
            - Path=/api/system/**

        # 文件分组必须在 /api/infra/** 通配之前
        - id: wu-service-file-group
          uri: lb://wu-service-file
          predicates:
            - Path=/api/infra/file-group,/api/infra/file-group/**

        # codegen 部署在 file；规范路径 /api/infra/codegen 须在 infra 通配前直达 file
        - id: wu-service-file-codegen
          uri: lb://wu-service-file
          predicates:
            - Path=/api/infra/codegen,/api/infra/codegen/**

        - id: wu-service-file
          uri: lb://wu-service-file
          predicates:
            - Path=/api/infra/file,/api/infra/file/**

        # 存量静态 URL 一期兼容：DB/前端历史 /api/files/** → /files/**
        - id: wu-service-file-api-static
          uri: lb://wu-service-file
          predicates:
            - Path=/api/files/**
          filters:
            - RewritePath=/api/files/(?<seg>.*), /files/$\{seg}

        - id: wu-service-file-static
          uri: lb://wu-service-file
          predicates:
            - Path=/file/**, /files/**

        - id: wu-service-infra
          uri: lb://wu-service-infra
          predicates:
            - Path=/api/infra/**, /api/monitor/**

        - id: wu-service-ai
          uri: lb://wu-service-ai
          predicates:
            - Path=/api/ai/**

        - id: wu-service-message
          uri: lb://wu-service-message
          predicates:
            - Path=/api/message/**, /ws/**, /api/ws/**

        - id: wu-service-pay
          uri: lb://wu-service-pay
          predicates:
            - Path=/api/pay/**

        - id: wu-service-order
          uri: lb://wu-service-order
          predicates:
            - Path=/api/order/**

# P0-1: Sa-Token 网关侧配置（必须在根级别，与 wu-cloud-auth 逐参数对齐，确保 Token 跨服务互认）
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  # 与 auth 及单体一致：Header + Cookie 双通道读 Token（登录后浏览器会写入 Authorization Cookie）
  is-read-cookie: true
  is-read-header: true
  is-write-header: false

# 防重放攻击（时间戳窗口 + Nonce 查重），对应单体 ApiSecurityFilter 的能力补齐
# 默认关闭：开启前需确认 PC 端与 uni-app 端均已发送 X-Timestamp / X-Nonce，
# 否则会导致未适配的客户端全量 403。建议测试环境先开、生产灰度放量。
# 注：ApiSecurity 过滤器已内嵌时间戳+Nonce 校验，开启 anti-replay 会与之下层重复，
# 二者保留其一即可（默认保持 anti-replay 关闭，由 api-security 统一处理）。
gateway:
  # 通过 LoadBalancer 访问 system 拉动态配置（勿写死 :9201 主机名，易被代理解析错）
  config-source-url: lb://wu-service-system/inner/system/config/get-group
  anti-replay:
    enabled: false
    timestamp-window-seconds: 300
    exclude-paths:
      - /api/pay/notify
      - /api/file/
      - /api/files/
      - /file/
      - /files/
      - /api/ws
      - /ws
      - /api/doc.html
      - /api/v3/api-docs
      - /api/swagger-ui
      - /api/webjars
      - /doc.html
      - /v3/api-docs
      - /swagger-ui
      - /webjars
      - /favicon.ico
  # 接口安全（与单体 ApiSecurityFilter 行为逐行对齐）：HMAC-SM3 验签 + SM4 收发加密
  # enabled: true 即强制全链路（= 单体全局安全开关打开），所有非公开/非排除接口必须携带
  # X-Client-Id / X-Timestamp / X-Nonce / X-Signature 并通过验签，否则 403。
  # 会话密钥由 /api/auth/session-sign-init 按 clientId 下发并写入 Redis
  # （security:session-sign:{clientId} / security:session-sm4:{clientId}），
  # 前端 security-config.ts 据此启用签名/加密，达到与单体一致的严格闭环效果。
  #
  # 注意：单体 context-path=/api，过滤器里看到的是去掉 /api 后的 servletPath；
  # 网关收到的是完整路径 /api/...，排除前缀必须带 /api，否则 Knife4j/静态文件/WebSocket 会 403。
  api-security:
    # 默认关闭，由 DB security 组动态控制（与单体一致）
    enabled: false
    timestamp-window-seconds: 300
    exclude-paths:
      - /api/auth/session-sign-init
      - /api/auth/config
      - /api/auth/captcha
      - /api/auth/slider-challenge
      - /api/auth/slider-verify
      - /api/pay/notify
      - /api/file/
      - /api/files/
      - /file/
      - /files/
      - /api/ws
      - /ws
      - /api/doc.html
      - /api/v3/api-docs
      - /api/swagger-ui
      - /api/webjars
      - /doc.html
      - /v3/api-docs
      - /swagger-ui
      - /webjars
      - /favicon.ico
    public-auth-uris:
      - /api/auth/session-sign-init
      - /api/auth/login
      - /api/auth/register
      - /api/auth/config
      - /api/auth/captcha
      - /api/auth/sms-code
      - /api/auth/slider-challenge
      - /api/auth/forgot-password
      - /api/auth/refresh-token
    streaming-uri-suffixes:
      - /ai/chat/stream
      - /ai-stream
  auth:
    whitelist:
      - /api/auth/**
      - /ws/**
      - /api/ws/**
      - /api/doc.html
      - /api/webjars/**
      - /api/swagger-ui/**
      - /api/v3/api-docs/**
      - /file/**
      - /files/**
      - /api/files/**
