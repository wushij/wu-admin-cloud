server:
  port: 9207

spring:
  application:
    name: wu-service-file
  config:
    import:
      - optional:nacos:wu-cloud-common.yaml?group=WU_CLOUD&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=WU_CLOUD&refreshEnabled=true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wu_file?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: WU_CLOUD
        register-enabled: true
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: WU_CLOUD
        file-extension: yaml
        import-check:
          enabled: false
  # P0-1: 业务服务需 Redis（wu-cloud-starter-redis 的 RedisService 依赖 StringRedisTemplate/RedissonClient）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

app:
  file:
    # 默认落在本模块 data/uploads（与单体源码 ./data/uploads 保持一致）。
    # 可用环境变量 FILE_LOCAL_BASE_DIR 覆盖（.vscode/launch.json、scripts/start-services.ps1）。
    local-base-dir: ${FILE_LOCAL_BASE_DIR:./data/uploads}
    max-size: 52428800
    # P1-4：留空表示「不限制白名单」，但 LocalFileStorage 中的高危后缀黑名单始终生效
    # （.jsp/.php/.html/.svg/.exe 等一律拒绝）。生产建议按需收敛为显式白名单，例如：
    # allowed-extensions: ".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.zip"
    allowed-extensions: ""
    recycle-retention-days: 30

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml

# ===== P0-1 修复：Sa-Token 配置（所有服务必须一致，否则 token 无法互认）=====
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# P0-3 修复：Feign 降级与熔断（Sentinel 接管 OpenFeign，fallbackFactory 才能生效）
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

# 内网端点零信任令牌(X-Inner-Token)
wu:
  security:
    inner-token: ${INNER_API_TOKEN:}

# ===== Unified file logging: output to <repo>/logs/ (logs/ is git-ignored) =====
# Console output is kept for mvn spring-boot:run; the file is for post-mortem review.
# Override the output root with the LOG_DIR environment variable.
logging:
  file:
    name: ${LOG_DIR:E:/wu-admin-cloud/logs}/file.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
