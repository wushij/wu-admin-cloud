server:
  port: 9300

spring:
  application:
    name: wu-service-infra
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wu-admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: WU_CLOUD
        register-enabled: true
        ip: 127.0.0.1
  # P0-1: 业务服务需 Redis（wu-cloud-starter-redis 的 RedisService 依赖 StringRedisTemplate/RedissonClient）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml

# ===== P0-1 修复：Sa-Token 配置（所有服务必须一致，否则 token 无法互认）=====
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# P0-3 修复：Feign 降级与熔断（Sentinel 接管 OpenFeign，fallbackFactory 才能生效）
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
